name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Unpack static portfolio
        run: |
          mkdir site
          cat site-part-{00,01,02,03,04}.bin | tar -xzf - -C site
          test -f site/index.html
          test -f site/projects/projects.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
